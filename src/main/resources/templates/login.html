<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login - Human in the Loop</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #F4F4F0 0%, #DDD8CE 50%, #BCC7C4 100%);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
        }

        .container {
            background: rgba(255, 255, 255, 0.98);
            backdrop-filter: blur(10px);
            padding: 50px;
            border-radius: 24px;
            box-shadow: 0 20px 60px rgba(60, 75, 82, 0.12);
            max-width: 450px;
            width: 100%;
            border: 1px solid rgba(188, 199, 196, 0.3);
        }

        .logo {
            width: 70px;
            height: 70px;
            background: linear-gradient(135deg, #3C4B52 0%, #A9B5C2 100%);
            border-radius: 16px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 32px;
            margin: 0 auto 25px;
            box-shadow: 0 8px 24px rgba(60, 75, 82, 0.15);
        }

        h2 {
            color: #3C4B52;
            text-align: center;
            margin-bottom: 10px;
            font-size: 28px;
            font-weight: 600;
            letter-spacing: -0.5px;
        }

        .subtitle {
            text-align: center;
            color: #8B7355;
            margin-bottom: 35px;
            font-size: 14px;
        }

        .form-group {
            margin-bottom: 25px;
        }

        label {
            display: block;
            color: #3C4B52;
            margin-bottom: 8px;
            font-weight: 500;
            font-size: 14px;
        }

        input {
            width: 100%;
            padding: 14px 16px;
            border: 2px solid #BCC7C4;
            border-radius: 10px;
            font-size: 15px;
            transition: all 0.3s;
            background: #F4F4F0;
            color: #3C4B52;
        }

        input:focus {
            outline: none;
            border-color: #A9B5C2;
            background: white;
        }

        .btn-login {
            width: 100%;
            padding: 16px;
            background: linear-gradient(135deg, #3C4B52 0%, #A9B5C2 100%);
            color: white;
            border: none;
            border-radius: 12px;
            font-size: 16px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s;
            margin-top: 10px;
            box-shadow: 0 4px 16px rgba(60, 75, 82, 0.25);
        }

        .btn-login:hover {
            transform: translateY(-2px);
            box-shadow: 0 6px 24px rgba(60, 75, 82, 0.35);
        }

        .back-link {
            text-align: center;
            margin-top: 25px;
        }

        .back-link a {
            color: #3C4B52;
            text-decoration: none;
            font-size: 14px;
            transition: color 0.3s;
        }

        .back-link a:hover {
            color: #A9B5C2;
        }

        .error-message {
            background: #DDD8CE;
            color: #8B7355;
            padding: 12px;
            border-radius: 8px;
            margin-bottom: 20px;
            font-size: 14px;
            text-align: center;
            border-left: 4px solid #A6A8A6;
        }
    </style>
</head>
<body>
<div class="container">
    <div class="logo">🔐</div>
    <h2>Welcome Back</h2>
    <p class="subtitle">Sign in to continue monitoring</p>

    <div id="errorMessage" class="error-message" style="display: none;"></div>

    <form id="loginForm">
        <div class="form-group">
            <label for="username">Username</label>
            <input type="text" id="username" name="username" required autocomplete="username">
        </div>

        <div class="form-group">
            <label for="password">Password</label>
            <input type="password" id="password" name="password" required autocomplete="current-password">
        </div>

        <button type="submit" class="btn-login">Sign In</button>
    </form>

    <div class="links" style="text-align: center; margin-top: 25px; display: flex; flex-direction: column; gap: 10px;">
        <a href="/register" style="color: #3C4B52; text-decoration: none; font-size: 14px;">Don't have an account? Register</a>
        <a href="/" style="color: #3C4B52; text-decoration: none; font-size: 14px;">← Back to Home</a>
    </div>
</div>

<script>
    document.getElementById('loginForm').addEventListener('submit', async function (e) {
        e.preventDefault();

        const username = document.getElementById('username').value;
        const password = document.getElementById('password').value;
        const errorDiv = document.getElementById('errorMessage');

        try {
            const response = await fetch('/api/auth/login', {
                method: 'POST',
                headers: {'Content-Type': 'application/json'},
                body: JSON.stringify({username, password})
            });

            if (response.ok) {
                const data = await response.json();
                localStorage.setItem('token', data.token);
                localStorage.setItem('username', data.username);
                localStorage.setItem('role', data.role);

                if (data.role === 'ROLE_ADMIN') {
                    window.location.href = '/menu';
                } else {
                    window.location.href = '/chat';
                }
            } else {
                errorDiv.textContent = 'Invalid username or password';
                errorDiv.style.display = 'block';
            }
        } catch (error) {
            errorDiv.textContent = 'Login failed. Please try again.';
            errorDiv.style.display = 'block';
        }
    });
</script>
</body>
</html>
