<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Human in the Loop - LLM Monitoring</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      background: linear-gradient(135deg, #F4F4F0 0%, #DDD8CE 50%, #BCC7C4 100%);
      min-height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      padding: 20px;
    }

    .container {
      background: rgba(255, 255, 255, 0.98);
      backdrop-filter: blur(10px);
      padding: 60px;
      border-radius: 24px;
      box-shadow: 0 20px 60px rgba(60, 75, 82, 0.12);
      text-align: center;
      max-width: 500px;
      width: 100%;
      border: 1px solid rgba(188, 199, 196, 0.3);
    }

    .logo {
      width: 80px;
      height: 80px;
      background: linear-gradient(135deg, #3C4B52 0%, #A9B5C2 100%);
      border-radius: 20px;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 36px;
      margin: 0 auto 30px;
      box-shadow: 0 8px 24px rgba(60, 75, 82, 0.15);
    }

    h1 {
      color: #3C4B52;
      margin-bottom: 15px;
      font-size: 32px;
      font-weight: 600;
      letter-spacing: -0.5px;
    }

    p {
      color: #8B7355;
      margin-bottom: 40px;
      font-size: 16px;
      line-height: 1.6;
    }

    .buttons {
      display: flex;
      flex-direction: column;
      gap: 15px;
    }

    .btn {
      padding: 16px 40px;
      border: none;
      border-radius: 12px;
      font-size: 16px;
      font-weight: 600;
      cursor: pointer;
      text-decoration: none;
      display: inline-block;
      transition: all 0.3s ease;
    }

    .btn-primary {
      background: linear-gradient(135deg, #3C4B52 0%, #A9B5C2 100%);
      color: white;
      box-shadow: 0 4px 16px rgba(60, 75, 82, 0.25);
    }

    .btn-primary:hover {
      transform: translateY(-2px);
      box-shadow: 0 6px 24px rgba(60, 75, 82, 0.35);
    }

    .btn-secondary {
      background: white;
      color: #3C4B52;
      border: 2px solid #BCC7C4;
    }

    .btn-secondary:hover {
      background: #F4F4F0;
      border-color: #A9B5C2;
    }
  </style>
</head>
<body>
<div class="container">
  <div class="logo">🤖</div>
  <h1>Human in the Loop</h1>
  <p>LLM Response Monitoring & Correction System</p>
  <div class="buttons">
    <a href="/login" class="btn btn-primary">Login</a>
    <a href="/chat" class="btn btn-secondary">Continue as Guest</a>
  </div>
</div>
</body>
</html>
