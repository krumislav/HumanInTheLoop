<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Admin Dashboard - Human in the Loop</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: #F4F4F0;
            overflow: hidden;
            height: 100vh;
        }

        .navbar {
            background: linear-gradient(135deg, #3C4B52 0%, #A9B5C2 100%);
            padding: 15px 30px;
            color: white;
            display: flex;
            justify-content: space-between;
            align-items: center;
            height: 60px;
            position: fixed;
            top: 0;
            left: 0;
            right: 0;
            z-index: 1000;
            box-shadow: 0 2px 12px rgba(60, 75, 82, 0.15);
        }

        .navbar h2 {
            margin: 0;
            font-size: 20px;
            font-weight: 500;
            letter-spacing: -0.3px;
        }

        .nav-buttons {
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .nav-buttons span {
            margin-right: 10px;
            font-size: 14px;
        }

        .nav-buttons a, .nav-buttons button {
            color: white;
            text-decoration: none;
            background: rgba(255, 255, 255, 0.15);
            border: none;
            padding: 8px 16px;
            border-radius: 8px;
            cursor: pointer;
            font-size: 14px;
            font-family: inherit;
            transition: all 0.2s;
        }

        .nav-buttons a:hover, .nav-buttons button:hover {
            background: rgba(255, 255, 255, 0.25);
        }

        .main-container {
            margin-top: 60px;
            height: calc(100vh - 60px);
            overflow-y: auto;
            padding: 40px;
        }

        .page-header {
            margin-bottom: 30px;
        }

        .page-header h1 {
            color: #3C4B52;
            margin-bottom: 10px;
            font-size: 32px;
            font-weight: 600;
            letter-spacing: -0.5px;
        }

        .page-header p {
            color: #8B7355;
            font-size: 16px;
        }

        .stats-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(250px, 1fr));
            gap: 20px;
            margin-bottom: 40px;
        }

        .stat-card {
            background: white;
            padding: 25px;
            border-radius: 12px;
            box-shadow: 0 2px 8px rgba(60, 75, 82, 0.08);
            border-left: 4px solid #3C4B52;
            border: 1px solid #BCC7C4;
        }

        .stat-card.pending {
            border-left: 4px solid #DDD8CE;
        }

        .stat-card.approved {
            border-left: 4px solid #BCC7C4;
        }

        .stat-card.rejected {
            border-left: 4px solid #A6A8A6;
        }

        .stat-card.corrected {
            border-left: 4px solid #A9B5C2;
        }

        .stat-card h3 {
            color: #8B7355;
            font-size: 14px;
            margin-bottom: 10px;
            text-transform: uppercase;
            font-weight: 500;
        }

        .stat-card .stat-value {
            font-size: 36px;
            font-weight: 700;
            color: #3C4B52;
        }

        .messages-section {
            background: white;
            padding: 30px;
            border-radius: 12px;
            box-shadow: 0 2px 8px rgba(60, 75, 82, 0.08);
            border: 1px solid #BCC7C4;
        }

        .messages-section h2 {
            color: #3C4B52;
            margin-bottom: 20px;
            font-size: 24px;
            font-weight: 600;
            letter-spacing: -0.3px;
        }

        .filter-buttons {
            display: flex;
            gap: 10px;
            margin-bottom: 20px;
            flex-wrap: wrap;
        }

        .filter-btn {
            padding: 8px 16px;
            border: 2px solid #BCC7C4;
            background: white;
            border-radius: 8px;
            cursor: pointer;
            font-size: 14px;
            transition: all 0.2s;
            color: #3C4B52;
            font-weight: 500;
        }

        .filter-btn:hover {
            background: #F4F4F0;
        }

        .filter-btn.active {
            background: linear-gradient(135deg, #3C4B52 0%, #A9B5C2 100%);
            color: white;
            border-color: #3C4B52;
        }

        .message-item {
            padding: 20px;
            border: 1px solid #BCC7C4;
            border-radius: 10px;
            margin-bottom: 15px;
            transition: all 0.2s;
            background: #F4F4F0;
        }

        .message-item:hover {
            box-shadow: 0 4px 12px rgba(60, 75, 82, 0.1);
            transform: translateY(-1px);
        }

        .message-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 15px;
        }

        .message-id {
            font-weight: 600;
            color: #3C4B52;
            font-size: 14px;
        }

        .message-status {
            padding: 5px 12px;
            border-radius: 6px;
            font-size: 12px;
            font-weight: 600;
            text-transform: uppercase;
        }

        .status-pending {
            background: #DDD8CE;
            color: #8B7355;
        }

        .status-approved {
            background: #BCC7C4;
            color: #3C4B52;
        }

        .status-rejected {
            background: #A6A8A6;
            color: white;
        }

        .status-corrected {
            background: #A9B5C2;
            color: white;
        }

        .message-prompt {
            color: #3C4B52;
            font-weight: 500;
            margin-bottom: 10px;
            font-size: 15px;
        }

        .message-response {
            color: #8B7355;
            font-size: 14px;
            line-height: 1.6;
            margin-bottom: 10px;
            white-space: pre-wrap;
        }

        .message-meta {
            display: flex;
            gap: 20px;
            font-size: 12px;
            color: #A6A8A6;
            margin-top: 10px;
            flex-wrap: wrap;
        }

        .message-meta span {
            display: flex;
            align-items: center;
            gap: 5px;
        }

        .corrected-box {
            margin-top: 15px;
            padding: 15px;
            background: #DDD8CE;
            border-radius: 8px;
            border-left: 4px solid #A9B5C2;
        }

        .corrected-box strong {
            color: #3C4B52;
        }

        .empty-state {
            text-align: center;
            padding: 60px 20px;
            color: #A6A8A6;
        }

        .empty-state p {
            font-size: 16px;
        }
    </style>
</head>
<body>
<div class="navbar">
    <h2>📊 Admin Dashboard</h2>
    <div class="nav-buttons" id="navButtons"></div>
</div>

<div class="main-container">
    <div class="page-header">
        <h1>Dashboard Overview</h1>
        <p>Monitor and review LLM chat responses</p>
    </div>

    <!-- Statistics Cards -->
    <div class="stats-grid">
        <div class="stat-card">
            <h3>Total Messages</h3>
            <div class="stat-value" id="totalMessages">-</div>
        </div>
        <div class="stat-card pending">
            <h3>Pending Review</h3>
            <div class="stat-value" id="pendingCount">-</div>
        </div>
        <div class="stat-card approved">
            <h3>Approved</h3>
            <div class="stat-value" id="approvedCount">-</div>
        </div>
        <div class="stat-card rejected">
            <h3>Rejected</h3>
            <div class="stat-value" id="rejectedCount">-</div>
        </div>
        <div class="stat-card corrected">
            <h3>Corrected</h3>
            <div class="stat-value" id="correctedCount">-</div>
        </div>
    </div>

    <!-- Messages Section -->
    <div class="messages-section">
        <h2>All Messages</h2>

        <!-- Filter Buttons -->
        <div class="filter-buttons">
            <button class="filter-btn active" onclick="filterMessages('ALL')">All</button>
            <button class="filter-btn" onclick="filterMessages('PENDING')">Pending</button>
            <button class="filter-btn" onclick="filterMessages('APPROVED')">Approved</button>
            <button class="filter-btn" onclick="filterMessages('REJECTED')">Rejected</button>
            <button class="filter-btn" onclick="filterMessages('CORRECTED')">Corrected</button>
        </div>

        <!-- Messages List -->
        <div id="messagesList">
            <div class="empty-state">
                <p>Loading messages...</p>
            </div>
        </div>
    </div>
</div>

<script>
    const token = localStorage.getItem('token');
    const role = localStorage.getItem('role');
    const username = localStorage.getItem('username');
    const navButtons = document.getElementById('navButtons');

    if (token && username) {
        let html = '<span>Hello, ' + username + '</span>';
        if (role && role.includes('ADMIN')) {
            html += '<a href="/dashboard">📊 Dashboard</a>';
            html += '<a href="/menu">🏠 Menu</a>';
        }
        html += '<a href="/chat">💬 Chat</a>';
        html += '<button onclick="logout()">Logout</button>';
        navButtons.innerHTML = html;
    } else {
        navButtons.innerHTML = '<a href="/login">Login</a>';
    }

    function logout() {
        localStorage.clear();
        window.location.href = '/';
    }

    let allMessages = [];
    let currentFilter = 'ALL';

    // Fetch Dashboard Stats
    async function fetchStats() {
        try {
            const response = await fetch('/api/dashboard/stats', {
                headers: {
                    'Authorization': 'Bearer ' + token
                }
            });
            const stats = await response.json();

            document.getElementById('totalMessages').textContent = stats.totalMessages;
            document.getElementById('pendingCount').textContent = stats.pendingCount;
            document.getElementById('approvedCount').textContent = stats.approvedCount;
            document.getElementById('rejectedCount').textContent = stats.rejectedCount;
            document.getElementById('correctedCount').textContent = stats.correctedCount;
        } catch (error) {
            console.error('Error fetching stats:', error);
        }
    }

    // Fetch All Messages
    async function fetchMessages() {
        try {
            const response = await fetch('/api/dashboard/messages', {
                headers: {
                    'Authorization': 'Bearer ' + token
                }
            });
            allMessages = await response.json();
            renderMessages();
        } catch (error) {
            console.error('Error fetching messages:', error);
            document.getElementById('messagesList').innerHTML = '<div class="empty-state"><p>Error loading messages</p></div>';
        }
    }

    // Render Messages
    function renderMessages() {
        const messagesList = document.getElementById('messagesList');

        let filteredMessages = allMessages;
        if (currentFilter !== 'ALL') {
            filteredMessages = allMessages.filter(msg => msg.status === currentFilter);
        }

        if (filteredMessages.length === 0) {
            messagesList.innerHTML = '<div class="empty-state"><p>📭 No messages found</p></div>';
            return;
        }

        let html = '';
        filteredMessages.forEach(msg => {
            const statusClass = 'status-' + msg.status.toLowerCase();
            const createdDate = new Date(msg.createdAt).toLocaleString('en-GB');

            html += `
                <div class="message-item">
                    <div class="message-header">
                        <span class="message-id">Message #${msg.id}</span>
                        <span class="message-status ${statusClass}">${msg.status}</span>
                    </div>
                    <div class="message-prompt">
                        <strong>🙋 User:</strong> ${escapeHtml(msg.userPrompt)}
                    </div>
                    <div class="message-response">
                        <strong>🤖 Assistant:</strong> ${escapeHtml(msg.assistantResponse)}
                    </div>
                    ${msg.status === 'CORRECTED' && msg.correctedResponse ? `
                        <div class="corrected-box">
                            <strong>✓ Corrected Response:</strong><br>
                            ${escapeHtml(msg.correctedResponse)}
                        </div>
                    ` : ''}
                    <div class="message-meta">
                        <span>🤖 Model: ${msg.modelName || 'N/A'}</span>
                        <span>📅 Created: ${createdDate}</span>
                        ${msg.reviewedAt ? `<span>✅ Reviewed: ${new Date(msg.reviewedAt).toLocaleString('en-GB')}</span>` : ''}
                    </div>
                </div>
            `;
        });

        messagesList.innerHTML = html;
    }

    // Filter Messages
    function filterMessages(status) {
        currentFilter = status;

        // Update active button
        document.querySelectorAll('.filter-btn').forEach(btn => {
            btn.classList.remove('active');
        });
        event.target.classList.add('active');

        renderMessages();
    }

    // Escape HTML to prevent XSS
    function escapeHtml(text) {
        const div = document.createElement('div');
        div.textContent = text;
        return div.innerHTML;
    }

    // Initial load
    fetchStats();
    fetchMessages();

    // Auto-refresh every 30 seconds
    setInterval(() => {
        fetchStats();
        fetchMessages();
    }, 30000);
</script>
</body>
</html>
