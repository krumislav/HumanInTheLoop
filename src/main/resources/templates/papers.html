<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Scientific Papers</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet"/>
</head>
<body class="bg-light">
<div class="container py-4">

    <div class="d-flex justify-content-between align-items-center mb-4">
        <h2>📄 Scientific Papers</h2>
        <a href="/chat" class="btn btn-outline-secondary">← Back to Chat</a>
    </div>

    <!-- Success / Error messages -->
    <div th:if="${param.success}" class="alert alert-success">
        Paper uploaded and processed successfully!
    </div>
    <div th:if="${param.deleted}" class="alert alert-warning">
        Paper deleted successfully.
    </div>
    <div th:if="${param.error == 'nofile'}" class="alert alert-danger">
        Please select a file to upload.
    </div>
    <div th:if="${param.error == 'notpdf'}" class="alert alert-danger">
        Only PDF files are allowed.
    </div>

    <!-- Upload form -->
    <div class="card mb-4">
        <div class="card-header fw-bold">Upload New Paper</div>
        <div class="card-body">
            <form th:action="@{/papers/upload}" method="post" enctype="multipart/form-data">
                <div class="row g-3">
                    <div class="col-md-4">
                        <label class="form-label">Title</label>
                        <input type="text" name="title" class="form-control" placeholder="Paper title" required/>
                    </div>
                    <div class="col-md-3">
                        <label class="form-label">Author</label>
                        <input type="text" name="author" class="form-control" placeholder="Author name" required/>
                    </div>
                    <div class="col-md-2">
                        <label class="form-label">Year</label>
                        <input type="number" name="year" class="form-control" placeholder="2024" required/>
                    </div>
                    <div class="col-md-3">
                        <label class="form-label">PDF File</label>
                        <input type="file" name="file" class="form-control" accept=".pdf" required/>
                    </div>
                </div>
                <div class="mt-3">
                    <button type="submit" class="btn btn-primary">Upload Paper</button>
                </div>
            </form>
        </div>
    </div>

    <!-- List of uploaded papers -->
    <div class="card">
        <div class="card-header fw-bold">
            Uploaded Papers
            <span class="badge bg-secondary ms-2" th:text="${papers.size()}"></span>
        </div>
        <div class="card-body p-0">
            <div th:if="${papers.isEmpty()}" class="p-4 text-muted">
                No papers uploaded yet.
            </div>
            <table th:if="${!papers.isEmpty()}" class="table table-hover mb-0">
                <thead class="table-light">
                    <tr>
                        <th>Title</th>
                        <th>Author</th>
                        <th>Year</th>
                        <th>File</th>
                        <th>Uploaded</th>
                        <th></th>
                    </tr>
                </thead>
                <tbody>
                    <tr th:each="paper : ${papers}">
                        <td th:text="${paper.title}"></td>
                        <td th:text="${paper.author}"></td>
                        <td th:text="${paper.year}"></td>
                        <td th:text="${paper.fileName}"></td>
                        <td th:text="${#temporals.format(paper.uploadedAt, 'dd MMM yyyy HH:mm')}"></td>
                        <td>
                            <form th:action="@{/papers/delete/{id}(id=${paper.id})}" method="post"
                                  onsubmit="return confirm('Delete this paper and all its chunks?')">
                                <button type="submit" class="btn btn-sm btn-danger">Delete</button>
                            </form>
                        </td>
                    </tr>
                </tbody>
            </table>
        </div>
    </div>

</div>
</body>
</html>
